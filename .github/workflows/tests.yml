name: Tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  container-smoke:
    name: Container build and fixture smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --pull --tag aws-security-scanner:ci .

      - name: Verify image runs as non-root
        run: |
          test "$(docker image inspect aws-security-scanner:ci --format '{{.Config.User}}')" = "10001:10001"

      - name: Run offline Terraform JSON smoke test
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/tests/fixtures/terraform:/fixtures:ro" \
            aws-security-scanner:ci \
            --source terraform \
            --file /fixtures/realistic_s3.json \
            --format json
