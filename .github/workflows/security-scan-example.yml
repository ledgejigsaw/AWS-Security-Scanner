name: Security scan example

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/fixtures/terraform/**"
      - ".github/workflows/security-scan-example.yml"
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Scan fixture data or an AWS account"
        type: choice
        options: [fixture, aws]
        default: fixture
        required: true
      aws_role_arn:
        description: "OIDC role ARN (required only for scan_mode=aws)"
        type: string
        required: false
      aws_region:
        description: "AWS region for the opt-in live scan"
        type: string
        default: "eu-west-2"
        required: false

permissions:
  contents: read

jobs:
  fixture-scan:
    if: github.event_name == 'pull_request' || inputs.scan_mode == 'fixture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install scanner
        run: python -m pip install -e .
      - name: Generate SARIF from synthetic Terraform JSON
        run: |
          mkdir -p reports
          aws-security-scan --source terraform --file tests/fixtures/terraform/realistic_s3.json --format sarif --output reports/security-scan.sarif
      - name: Retain SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-sarif
          path: reports/security-scan.sarif
          if-no-files-found: error
          retention-days: 14

  live-aws-scan:
    if: github.event_name == 'workflow_dispatch' && inputs.scan_mode == 'aws'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate OIDC inputs
        env:
          ROLE_ARN: ${{ inputs.aws_role_arn }}
        run: |
          test -n "$ROLE_ARN" || { echo "aws_role_arn is required for live scans"; exit 2; }
      - name: Configure short-lived AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Install scanner
        run: python -m pip install -e .
      - name: Run read-only AWS scan
        run: |
          mkdir -p reports
          aws-security-scan --source aws --region "${{ inputs.aws_region }}" --format sarif --output reports/security-scan.sarif
      - name: Retain SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: aws-security-scan-sarif
          path: reports/security-scan.sarif
          if-no-files-found: error
          retention-days: 14
