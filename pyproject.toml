[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "aws-security-scanner"
version = "0.1.0"
description = "Read-only AWS cloud security posture assessment tool"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "rich"
]


[project.optional-dependencies]
dev = [
    "pytest"
]


[project.scripts]
aws-security-scan = "aws_security_scanner.cli:main"


[tool.pytest.ini_options]
pythonpath = ["src"]